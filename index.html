<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QBTC Risk Dashboard</title>
    <meta
      name="description"
      content="Track how much Bitcoin is exposed to quantum attacks: addresses with revealed public keys from address reuse and high-risk script types, indexed from the chain."
    />
    <!-- Mobile browser bar colour, matching the header's top strip (bg-gray-50 / dark:bg-zinc-900).
         src/stores/themeStore.ts overrides both when the user picks a theme explicitly. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F9FAFB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18181B" />

    <!-- Link previews (Slack, X, Telegram, WhatsApp, Discord, LinkedIn, iMessage).
         These bots don't run JavaScript, so the tags must stay static here.
         The site URL placeholder is replaced at build time (VITE_SITE_URL, see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QBTC Risk Dashboard" />
    <meta property="og:title" content="QBTC Risk Dashboard" />
    <meta
      property="og:description"
      content="How much BTC sits in addresses with exposed public keys: reused addresses and high-risk script types."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="QBTC Bitcoin Quantum Risk Dashboard" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QBTC Risk Dashboard" />
    <meta
      name="twitter:description"
      content="How much BTC sits in addresses with exposed public keys: reused addresses and high-risk script types."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />
    <link rel="canonical" href="__SITE_URL__/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
